name: Reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLCONFIGDIR: ${{ github.workspace }}/results/.mplcache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-revision.txt
      - name: Install the reproduction environment
        run: python -m pip install -r requirements-revision.txt
      - name: Check release and saved scientific results (no optimization)
        run: |
          python scripts/check_release.py
          python scripts/verify_revision.py artifacts/revision_2026_09_21
      - name: Run the small smoke instance
        # Uses the restricted small-model license bundled with gurobipy.
        # No solver credentials or repository secrets are required.
        run: python scripts/run_all.py --quick
      - name: Install figure-rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended cm-super dvipng ghostscript
      - name: Reproduce figures and tables from the reference archive
        run: python scripts/export_revision.py --results-dir artifacts/revision_2026_09_21 --output-dir results/reproduced_figures
      - name: Validate citation metadata
        run: |
          python -m pip install cffconvert==2.0.0
          cffconvert --validate
